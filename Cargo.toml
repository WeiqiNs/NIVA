[package]
name = "niva"
version = "0.1.0"
edition = "2024"
description = "Non-interactive verifiable aggregation (PEAR): inner-product functional encryption over class groups with fully linear PCPs"
license = "Apache-2.0"
repository = "https://github.com/WeiqiNs/NIVA"
readme = "README.md"
keywords = ["zero-knowledge", "encryption", "class-groups", "aggregation", "cryptography"]
categories = ["cryptography"]
exclude = [".github", "codecov.yml", "deny.toml", "CLAUDE.md"]
publish = false

[dependencies]
ark-ff = "0.6.0"
ark-std = "0.6.0"
dashu-int = "0.6"
rayon = { version = "1.12", optional = true }
rust_flpcp = { version = "0.1.0", git = "https://github.com/WeiqiNs/RustFLPCP", rev = "4bcc8c0eda6220db56266b79f456813f8d734a23" }

[features]
parallel = ["dep:rayon", "ark-ff/parallel", "ark-std/parallel", "rust_flpcp/parallel"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[profile.dev.package."*"]
opt-level = 3
